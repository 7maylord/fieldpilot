services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fieldpilot}
      POSTGRES_USER: ${POSTGRES_USER:-fieldpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fieldpilot}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-fieldpilot} -d ${POSTGRES_DB:-fieldpilot}',
        ]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-fieldpilot}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-fieldpilot-secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

  clamav:
    image: clamav/clamav:latest
    platform: linux/amd64
    ports:
      - '3310:3310'

volumes:
  postgres-data:
  minio-data:
