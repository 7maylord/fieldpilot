services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: fieldpilot
      MINIO_ROOT_PASSWORD: fieldpilot-secret
    ports:
      - '59000:9000'
      - '59001:9001'
    volumes:
      - minio-data:/data

volumes:
  minio-data:
